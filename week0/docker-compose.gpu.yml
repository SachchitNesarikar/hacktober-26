# NVIDIA GPU override (needs the NVIDIA Container Toolkit):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: >
      -hf ${LLAMA_MODEL:-ggml-org/gemma-4-E4B-it-GGUF:Q4_K_M}
      --host 0.0.0.0 --port 8080 -c ${LLAMA_CTX:-8192} --jinja -ngl 99
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
